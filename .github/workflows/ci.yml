name: CI
on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test

  android:
    runs-on: ubuntu-latest   # GitHub runners ship the Android SDK, so graft-compose is built too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - working-directory: android
        run: ./gradlew :graft-core:test :graft-compose:assembleDebug

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - working-directory: ios
        run: swift test
      - working-directory: ios
        run: xcodebuild -scheme Graft-Package -destination 'generic/platform=iOS Simulator' build
